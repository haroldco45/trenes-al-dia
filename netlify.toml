[build]
  ignore = "git log -1 --pretty='%an %ae' | grep -qiE 'robot|github-actions'"  # no publicar commits del robot (ahorra créditos)
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
